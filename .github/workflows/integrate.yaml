name: Integracion continua

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  ci_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 14.15.1
      - run: npm ci
      - name: npm init
        run: npm init -y
      - name: Run enpoints tests
        run: npm test
      - name: Building the project
        run: npm run build
  